spring.application.name=inventory-workflow-api

# Servidor REST local. Puede sobrescribirse con SERVER_PORT.
server.port=${SERVER_PORT:8080}

# Base H2 efímera: se reinicializa al cerrar la aplicación.
spring.datasource.url=jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

# H2 console: solo para desarrollo local, no habilitar en producción.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# El esquema y los datos se recrean en cada ejecución del prototipo.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Orígenes permitidos para el frontend local de Vite.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Errores REST con estructura estándar Problem Details.
spring.mvc.problemdetails.enabled=true

# Saldo inicial exclusivamente ficticio para el prototipo de flujo de caja.
app.cash.opening-balance-cop=${CASH_OPENING_BALANCE_COP:320000000}
